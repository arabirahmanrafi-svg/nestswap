# Starts MySQL 8 for NestSwap:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: nestswap-mysql
    environment:
      MYSQL_DATABASE: nestswap
      MYSQL_USER: nestswap
      MYSQL_PASSWORD: nestswap
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - nestswap-data:/var/lib/mysql
volumes:
  nestswap-data:
