# ---------- Server ----------
server.port=8080

# ---------- MySQL (default profile) ----------
# Override with env vars DB_URL / DB_USER / DB_PASSWORD, or edit here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nestswap?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:nestswap}
spring.datasource.password=${DB_PASSWORD:nestswap}

# We manage tables ourselves in schema.sql (good SQL practice), so Hibernate only validates nothing.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=60MB
app.upload-dir=${UPLOAD_DIR:uploads}
app.max-images-per-listing=10

# ---------- Auth ----------
# CHANGE THIS in production: any random string of 32+ characters.
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-string-0123456789}
app.jwt.expiration-hours=168

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Load related rows (owners, photos) in batches instead of one query each
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Email (optional) ----------
# Leave spring.mail.host unset and emails are printed to the console instead.
# Gmail example: create an "App password" in your Google account, then set:
#   MAIL_HOST=smtp.gmail.com  MAIL_PORT=587  MAIL_USER=you@gmail.com  MAIL_PASSWORD=<app password>
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:NestSwap <no-reply@nestswap.local>}

# Used for links inside alert emails
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Saved-search alert job: first run 1 min after startup, then every hour
app.alerts.initial-delay-ms=60000
app.alerts.interval-ms=3600000
app.seed-demo=false
