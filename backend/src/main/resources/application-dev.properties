# "dev" profile: in-memory H2 database in MySQL mode, so you can run the API
# without installing MySQL.  Data resets on every restart.
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:mem:nestswap;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Fill the empty in-memory database with sample listings
app.seed-demo=true
# Check saved-search alerts every 2 minutes so you can see them work in the console
app.alerts.initial-delay-ms=30000
app.alerts.interval-ms=120000
